name: Validate BTR preferences sync

on:
  pull_request:
    branches: [btr]
    paths:
      - lib/utils/config_archive.dart
      - lib/utils/storage_pref.dart
      - lib/pages/setting/models/video_settings.dart
      - lib/pages/video/controller.dart
      - test/utils/storage_pref_test.dart
      - test/pages/video_settings_sync_test.dart
      - tool/tests/test_maintenance.py
      - tool/tests/test_release_privacy.py
      - tool/tests/test_privacy_workflows.py
      - tool/release_privacy.py
      - tool/release-privacy-policy.json
      - tool/prepare_public_ios.py
      - tool/check_public_identity.py
      - .github/workflows/btr-maintain.yml
      - .github/workflows/btr-sync-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      UPSTREAM: affac5334fc41744894618d9fb53b7101db9532a
      BTR_UPSTREAM: 97663e3ab5532b37748a6ec4c3567ae209a777d0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact PR head and replay blocked sources
        env:
          RELEASE_PRIVATE_TERMS_JSON: ${{ secrets.RELEASE_PRIVATE_TERMS_JSON }}
        run: |
          python3 -m unittest discover -s tool/tests -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch https://github.com/bggRGjQaUbCoE/PiliPlus.git "$UPSTREAM"
          git fetch https://github.com/nishuodedui1145-del/PiliPlus.git "$BTR_UPSTREAM"
          python3 tool/prepare_btr_sync.py --base "$(git rev-parse HEAD)" --upstream "$UPSTREAM" --btr-upstream "$BTR_UPSTREAM"
          python3 tool/check_public_identity.py
          git merge-base --is-ancestor "$UPSTREAM" HEAD
          git merge-base --is-ancestor "$BTR_UPSTREAM" HEAD
          python3 tool/check_btr.py
          python3 -m unittest discover -s tool/tests -v
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Apply current upstream SDK patches
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS
      - name: Verify preferences, BTR and complete application
        run: |
          python3 tool/make_btr_mirror.py
          flutter test --no-pub --dart-define=BTR_SYNC_CANDIDATE=true test/utils/storage_pref_test.dart test/pages/video_settings_sync_test.dart test/utils/video_quality_select_test.dart test/utils/audio_quality_select_test.dart test/utils/cdn_url_test.dart test/utils/ios_airplay_helper_test.dart test/utils/airplay_hls_test.dart test/standalone/btr_akamai_test.dart test/standalone/btr_bitrate_unit_test.dart test/standalone/btr_cdn_racer_test.dart test/standalone/btr_round22_test.dart test/standalone/btr_round23_test.dart test/standalone/btr_round26_test.dart
          dart tool/tests/btr_update_test.dart
          flutter analyze --no-pub --no-fatal-infos
      - name: Build candidate without publishing
        shell: pwsh
        run: lib/scripts/build.ps1 btr-ios
      - name: Build and privacy-check candidate without uploading
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub
          python3 tool/prepare_public_ios.py build/ios/iphoneos/Runner.app
          mkdir -p build/privacy-check/Payload
          ditto build/ios/iphoneos/Runner.app build/privacy-check/Payload/Runner.app
          ipa="build/privacy-check/PiliPlus-BTR-validation.ipa"
          (cd build/privacy-check && zip -q -r9 PiliPlus-BTR-validation.ipa Payload)
          python3 tool/release_privacy.py "$ipa" --allow-home-user runner --policy tool/release-privacy-policy.json --report build/privacy-check/privacy-report.json
