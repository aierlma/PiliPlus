name: Validate BTR preferences sync

on:
  pull_request:
    branches: [btr]
    paths:
      - .gitignore
      - tool/prepare_btr_sync.py
      - tool/tests/fixtures/audio_session_official.txt
      - tool/tests/fixtures/video_offline_sync_test.dart.txt
      - tool/tests/run_audio_session_contract.py
      - tool/tests/run_external_seek_contract.py
      - tool/tests/run_btr_seek_contract.py
      - lib/services/audio_session.dart
      - lib/utils/config_archive.dart
      - lib/utils/storage_pref.dart
      - lib/pages/setting/models/video_settings.dart
      - lib/pages/video/controller.dart
      - lib/pages/video/view.dart
      - lib/plugin/pl_player/controller.dart
      - lib/utils/ios/external_seek.dart
      - test/utils/external_display_helper_test.dart
      - test/utils/external_display_app_test.dart
      - test/utils/storage_pref_test.dart
      - test/pages/video_settings_sync_test.dart
      - tool/tests/test_maintenance.py
      - tool/tests/test_release_privacy.py
      - tool/tests/test_privacy_workflows.py
      - tool/release_privacy.py
      - tool/release-privacy-policy.json
      - tool/prepare_public_ios.py
      - tool/check_public_identity.py
      - tool/tests/test_public_identity.py
      - .github/workflows/btr-maintain.yml
      - .github/workflows/btr-sync-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      UPSTREAM: 217fb54f51f6764176319bbdedab2a7522d75401
      BTR_UPSTREAM: e133cd90fe3a518aa986e58145912d21bfe8706f
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify publisher identity against the current base
        env:
          RELEASE_PRIVATE_TERMS_JSON: ${{ secrets.RELEASE_PRIVATE_TERMS_JSON }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_checkout="$RUNNER_TEMP/piliplus-identity-base"
          git worktree add --detach "$base_checkout" "$BASE_SHA"
          (cd "$base_checkout" && python3 "$GITHUB_WORKSPACE/tool/check_public_identity.py")
          git worktree remove "$base_checkout"
      - name: Verify exact PR head and replay blocked sources
        env:
          RELEASE_PRIVATE_TERMS_JSON: ${{ secrets.RELEASE_PRIVATE_TERMS_JSON }}
        run: |
          python3 -m unittest discover -s tool/tests -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch https://github.com/bggRGjQaUbCoE/PiliPlus.git "$UPSTREAM"
          git fetch https://github.com/nishuodedui1145-del/PiliPlus.git "$BTR_UPSTREAM"
          python3 tool/prepare_btr_sync.py --base "$(git rev-parse HEAD)" --upstream "$UPSTREAM" --btr-upstream "$BTR_UPSTREAM"
          python3 tool/check_public_identity.py
          git merge-base --is-ancestor "$UPSTREAM" HEAD
          git merge-base --is-ancestor "$BTR_UPSTREAM" HEAD
          python3 tool/check_btr.py
          python3 -m unittest discover -s tool/tests -v
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Apply current upstream SDK patches
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS
      - name: Verify preferences, BTR and complete application
        env:
          LEGACY_SEEK_REF: ab6b4058c1da2ee9957a92502a961ea1ccbae1e0
        run: |
          python3 tool/make_btr_mirror.py
          python3 tool/tests/run_audio_session_contract.py
          python3 tool/tests/run_external_seek_contract.py --legacy-ref "$LEGACY_SEEK_REF"
          python3 tool/tests/run_external_seek_contract.py
          python3 tool/tests/run_btr_seek_contract.py
          cp tool/tests/fixtures/video_offline_sync_test.dart.txt test/pages/video_offline_sync_test.dart
          flutter test --no-pub --dart-define=BTR_SYNC_CANDIDATE=true test/pages/login/geetest/captcha_config_test.dart test/pages/video_offline_sync_test.dart test/utils/dlna_utils_test.dart test/utils/storage_pref_test.dart test/pages/video_settings_sync_test.dart test/utils/video_quality_select_test.dart test/utils/audio_quality_select_test.dart test/utils/cdn_url_test.dart test/utils/ios_airplay_helper_test.dart test/utils/airplay_hls_test.dart test/utils/external_display_helper_test.dart test/utils/external_display_app_test.dart test/standalone/btr_akamai_test.dart test/standalone/btr_bitrate_unit_test.dart test/standalone/btr_cdn_racer_test.dart test/standalone/btr_round22_test.dart test/standalone/btr_round23_test.dart test/standalone/btr_round26_test.dart
          dart tool/tests/btr_update_test.dart
          flutter analyze --no-pub --no-fatal-infos
      - name: Build candidate without publishing
        shell: pwsh
        run: lib/scripts/build.ps1 btr-ios
      - name: Build and privacy-check candidate without uploading
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub
          python3 tool/prepare_public_ios.py build/ios/iphoneos/Runner.app
          mkdir -p build/privacy-check/Payload
          ditto build/ios/iphoneos/Runner.app build/privacy-check/Payload/Runner.app
          ipa="build/privacy-check/PiliPlus-BTR-validation.ipa"
          (cd build/privacy-check && zip -q -r9 PiliPlus-BTR-validation.ipa Payload)
          python3 tool/release_privacy.py "$ipa" --allow-home-user runner --policy tool/release-privacy-policy.json --report build/privacy-check/privacy-report.json
