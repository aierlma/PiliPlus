name: Diagnose iOS native preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'aierlma/PiliPlus'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Inspect the existing CI artifact with this toolchain
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRIVATE_TERMS_JSON: ${{ secrets.RELEASE_PRIVATE_TERMS_JSON }}
        run: |
          set -euo pipefail
          gh release download v2.1.6-btr.5668-8b9f8b1e12fd --repo aierlma/PiliPlus --pattern '*.ipa' --dir sample
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          import sys
          import zipfile
          sys.path.insert(0, 'tool')
          from check_public_identity import _patterns
          from prepare_public_ios import PreparationError, prepare
          from release_privacy import scan_artifact
          patterns = _patterns(json.loads(os.environ['RELEASE_PRIVATE_TERMS_JSON']))
          ipa, = Path('sample').glob('*.ipa')
          assert hashlib.sha256(ipa.read_bytes()).hexdigest() == '085cb76633ae74f03a1ac967268e6ebe196453affa19c49b8a367fc712407be7'
          with zipfile.ZipFile(ipa) as archive:
              for info in archive.infolist():
                  path = Path(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and not stat.S_ISLNK(info.external_attr >> 16)
              archive.extractall('sample/unpacked')
              for info in archive.infolist():
                  Path('sample/unpacked', info.filename).chmod((info.external_attr >> 16) & 0o777)
          app = Path('sample/unpacked/Payload/Runner.app')
          subprocess.run(['xcodebuild', '-version'], check=True)
          developer = subprocess.check_output(['xcode-select', '-p'], text=True).strip()
          strip = Path(subprocess.check_output(['xcrun', '--find', 'strip'], text=True).strip())
          print(json.dumps({'developer_bundle': Path(developer).parents[1].name, 'strip_sha256': hashlib.sha256(strip.read_bytes()).hexdigest(), 'input_ass_sha256': hashlib.sha256((app / 'Frameworks/Ass.framework/Ass').read_bytes()).hexdigest()}), flush=True)
          def run(command, **kwargs):
              result = subprocess.run(command, **kwargs)
              if result.returncode:
                  diagnostic = (result.stderr or b'').decode('utf-8', errors='replace')
                  for value, replacement in ((str(app), '[APP]'), (str(Path.cwd()), '[WORKSPACE]'), (str(Path.home()), '[CI_HOME]')):
                      diagnostic = diagnostic.replace(value, replacement)
                  diagnostic = re.sub(r'/Users/[^/\s]+', '[HOME]', diagnostic)
                  for pattern in patterns:
                      diagnostic = pattern.sub('[REDACTED]', diagnostic)
                  diagnostic = diagnostic[:4000]
                  with zipfile.ZipFile('sample/diagnostic.zip', 'w') as archive:
                      archive.writestr('diagnostic.txt', diagnostic)
                  report = scan_artifact('sample/diagnostic.zip')
                  if report['status'] == 'pass' and report['complete']:
                      print(json.dumps({'native_tool_diagnostic': diagnostic}), flush=True)
                  else:
                      print('Native diagnostic withheld by privacy check.', flush=True)
              return result
          try:
              print('Prepared native executables:', prepare(app, runner=run))
          except PreparationError as error:
              print(json.dumps(error.report), flush=True)
              raise SystemExit(1)
          PY
