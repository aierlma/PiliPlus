name: Build for iOS

on:
  workflow_call:
    secrets:
      RELEASE_PRIVATE_TERMS_JSON:
        required: true
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      airplay_caption_probe:
        description: "Build temporary AirPlay caption comparison (do not publish)"
        type: boolean
        default: false

jobs:
  build-macos-app:
    name: Release IOS
    runs-on: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify pristine source and release tooling
        env:
          RELEASE_PRIVATE_TERMS_JSON: ${{ secrets.RELEASE_PRIVATE_TERMS_JSON }}
        run: |
          python3 tool/check_public_identity.py
          python3 tool/check_btr.py
          python3 -m unittest discover -s tool/tests -v

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1 btr-ios

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: Verify patched application and BTR
        run: |
          python3 tool/make_btr_mirror.py
          flutter test --no-pub --dart-define=BTR_SYNC_CANDIDATE=true test/utils/storage_pref_test.dart test/pages/video_settings_sync_test.dart test/utils/video_quality_select_test.dart test/utils/audio_quality_select_test.dart test/utils/cdn_url_test.dart test/utils/ios_airplay_helper_test.dart test/utils/airplay_hls_test.dart test/standalone/btr_akamai_test.dart test/standalone/btr_bitrate_unit_test.dart test/standalone/btr_cdn_racer_test.dart test/standalone/btr_round22_test.dart test/standalone/btr_round23_test.dart test/standalone/btr_round26_test.dart
          dart tool/tests/btr_update_test.dart
          flutter test --no-pub test/utils/external_display_app_test.dart test/utils/external_display_helper_test.dart
          flutter analyze --no-pub --no-fatal-infos

      - name: Build iOS
        id: package
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --dart-define=AIRPLAY_CAPTION_PROBE=${{ inputs.airplay_caption_probe == true }} --no-pub
          python3 tool/prepare_public_ios.py build/ios/iphoneos/Runner.app
          ln -sf ./build/ios/iphoneos Payload
          ipa="PiliPlus-BTR_ios_${version}.ipa"
          zip -r9 "$ipa" Payload/Runner.app
          python3 tool/release_privacy.py "$ipa" --allow-home-user runner --policy tool/release-privacy-policy.json --report privacy-report.json
          echo "ipa_path=$ipa" >> "$GITHUB_OUTPUT"

      - name: Release
        if: ${{ github.event.inputs.tag != '' && inputs.airplay_caption_probe != true }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: |
            ${{ steps.package.outputs.ipa_path }}

      - name: Upload ios release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: iOS-release
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
